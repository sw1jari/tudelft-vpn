# Local DNS forwarder for split DNS with eduVPN.
# Everything goes to the normal connection's DNS; only the VPN's own domains
# (tudelft.net) go to the VPN's DNS servers. /etc/resolv.conf points here.
listen-address=127.0.0.1
port=53
bind-interfaces
user=dnsmasq
no-hosts
domain-needed
cache-size=1000
resolv-file=/run/tudelft-vpn-dns/upstream.conf
servers-file=/run/tudelft-vpn-dns/vpn.conf
